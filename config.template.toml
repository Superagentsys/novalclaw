# ============================================================================
# OmniNova Claw Configuration
# Copy to ~/.omninova/config.toml and edit to your needs.
# All fields have sensible defaults – only uncomment what you want to change.
# Environment variables (OMNINOVA_*) override values in this file.
# ============================================================================

# --- Core API ---
# api_key = "sk-..."
# api_url = "https://ark.cn-beijing.volces.com/api/v3"
# default_provider = "doubao"
# default_model = "doubao-seed-2-0-pro-260215"
# default_temperature = 0.7

# Provider API mode: "chat", "completion", or "responses"
# provider_api = "chat"

# --- Named Model Providers ---
# [model_providers.openai]
# api_key_env = "OPENAI_API_KEY"
# base_url = "https://api.openai.com/v1"
# default_model = "gpt-5"
# models = ["gpt-5", "gpt-5-mini", "gpt-4.1", "gpt-4o", "o3"]
# enabled = true
#
# [model_providers.gemini]
# api_key_env = "GEMINI_API_KEY"
# base_url = "https://generativelanguage.googleapis.com"
# default_model = "gemini-3.1-pro"
# models = ["gemini-3.5-flash", "gemini-3.1-pro", "gemini-2.5-pro", "gemini-2.5-flash"]
# enabled = true
#
# [model_providers.deepseek]
# api_key_env = "DEEPSEEK_API_KEY"
# base_url = "https://api.deepseek.com"
# default_model = "deepseek-v4-pro"
# models = ["deepseek-v4-pro", "deepseek-v4-flash", "deepseek-chat", "deepseek-reasoner"]
# enabled = true
# timeout_secs = 120
# Optional per-request generation cap (not the model's theoretical max output).
# Leave unset to use OmniNova's default request generation policy (32000),
# clamped to the model maximum when known.
# request_max_output_tokens = 64000
#
# [model_providers.qwen]
# api_key_env = "DASHSCOPE_API_KEY"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# default_model = "qwen3.7-max"
# models = ["qwen3.7-max", "qwen3.6-plus", "qwen3.6-flash", "qwen-plus"]
# enabled = true
#
# [model_providers.ollama]
# base_url = "http://localhost:11434/v1"   # 需带 /v1（OpenAI 兼容端点）；本地服务无需 API Key
# default_model = "gemma"
# models = ["gemma", "gemma3", "llama3.2", "qwen2.5", "deepseek-r1", "mistral"]
# enabled = true
#
# [model_providers.anthropic]
# api_key_env = "ANTHROPIC_API_KEY"
# base_url = "https://api.anthropic.com"
# default_model = "claude-sonnet-4-6"
# models = ["claude-fable-5", "claude-opus-4-8", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"]
# enabled = true

# --- Provider Behavior ---
# [provider]
# reasoning_level = "medium"   # minimal, low, medium, high, xhigh

# --- Agent ---
# [agent]
# name = "omninova"
# system_prompt = "You are a helpful AI assistant."
# compact_context = true
# max_tool_iterations = 20
# max_history_messages = 50
# parallel_tools = false

# Plan-Execute-Reflect loop (off by default; plain ReAct otherwise).
# A planner decomposes the task, the executor runs each step with tools,
# and an isolated reflector judges progress and may trigger a replan.
# [agent.planning]
# enabled = false
# max_plan_steps = 8
# max_replans = 2

# Hard per-request budgets spanning plan/execute/reflect. Unset = unlimited.
# [agent.budget]
# max_total_tokens = 200000
# max_wall_time_secs = 600
# max_provider_calls = 50

# --- Delegate Agents ---
# When at least one [agents.*] entry exists, agents gain a `delegate` tool to
# hand subtasks to each other at runtime (Orchestrator-Workers). Spawn depth
# and child concurrency follow [agents.defaults.subagents] limits; agents with
# an `allowed_tools` list must include "delegate" to use it.
# [agents.researcher]
# provider = "openrouter"
# model = "anthropic/claude-sonnet-4-20250514"
# system_prompt = "You are a research assistant."
# max_depth = 2
# agentic = true
# allowed_tools = ["web_search", "http_request", "file_read", "delegate"]
# max_iterations = 8

# --- Skills ---
# 系统提示词只内联前 catalog_prompt_limit 条技能目录，其余靠
# `use_skill {"query": "..."}` 检索，所以镜像整个技能市场（上万个 SKILL.md）
# 也不会把提示词撑爆。0 = 不限，等于全量内联：11000 个技能会产生约 3MB、
# 400 万 token 的系统提示词，单靠它就超出任何模型的输入预算。
# catalog_description_limit 是每条目录项的描述字符上限，0 = 不截断。
# [skills]
# open_skills_enabled = true
# open_skills_dir = "~/.omninova/skills"
# prompt_injection_mode = "full"
# catalog_prompt_limit = 150
# catalog_description_limit = 160

# --- Global permission mode ---
# Restricted preserves the granular autonomy/security/approval settings below.
# Full access bypasses OmniNova approval prompts and policy allowlists, but only
# within the OS permissions already granted to the OmniNova process.
# [permissions]
# mode = "restricted"           # restricted, full_access

# --- Autonomy ---
# [autonomy]
# level = "supervised"          # supervised, semi, autonomous
# workspace_only = true
# allowed_commands = ["git", "npm", "cargo", "ls", "cat", "grep", "find", "echo", "pwd"]
# forbidden_paths = ["/etc", "/root", "~/.ssh", "~/.aws"]
# max_actions_per_hour = 20
# max_cost_per_day_cents = 500
# require_approval_for_medium_risk = true
# block_high_risk_commands = true
# auto_approve = ["file_read", "memory_recall"]

# --- Security ---
# [security.otp]
# enabled = false
# method = "totp"
# gated_actions = []
#
# [security.estop]
# enabled = true
# require_otp_to_resume = false
#
# [security.syscall_anomaly]
# enabled = false
# strict_mode = false
#
# [security.sandbox]
# enabled = false
# workspace_jail = true
# strip_environment = true
# allowed_env_vars = []
#
# [security.audit]
# enabled = false
# log_file = "~/.omninova/.omninova-audit.log"
# record_arguments = false
#
# [security.tool_policy]
# enabled = true
# allowed_tools = []
# denied_tools = []
#
# [approvals]
# enabled = true
# mode = "supervised"
# auto_approve = ["file_read", "memory_recall"]
# require_approval = ["shell", "file_write", "file_edit", "git_operations", "browser", "computer_use", "http_request"]

# --- Runtime ---
# [runtime]
# kind = "native"               # native, docker, wasm
# reasoning_enabled = false
# reasoning_level = "medium"
#
# [runtime.wasm]
# tools_dir = "tools/wasm"
# fuel_limit = 2000000
# memory_limit_mb = 128
# max_module_size_mb = 64
# allow_workspace_read = true
# allow_workspace_write = true
# allowed_hosts = ["localhost:3000"]
#
# [runtime.wasm.security]
# require_workspace_relative_tools_dir = true
# reject_symlink_modules = true
# strict_host_validation = true
# capability_escalation_mode = "clamp"   # clamp, deny
# module_hash_policy = "warn"            # warn, enforce, ignore

# --- Memory ---
# 长期记忆（跨会话、跨重启保留），由 memory_store / memory_recall 工具读写。
# db_path 留空时数据库落在当前 workspace 目录下的 .omninova-memory.db；
# workspace 未设置时退化为进程内存储（退出即丢失）。
# [memory]
# backend = "sqlite"            # sqlite（默认，增量写入）, json, in_memory, none
# db_path = "~/.omninova/memory.db"
# search_expand_query = true
# search_recency_weight = 2.0
# search_recency_half_life_days = 7.0
#
# 配置 provider 后启用语义检索：关键词检索与向量相似度按倒数排名融合。
# 本地推理服务（Ollama / vLLM）可省略 api_key。embedding 请求失败会自动
# 降级为纯关键词检索，不会导致写入或搜索失败。
# 注意：启用后每轮对话都会额外产生一次 embedding 请求。
# [memory.embedding]
# provider = "openai"
# model = "text-embedding-3-small"
# api_key = ""
# base_url = "https://api.openai.com/v1"

# --- Storage ---
# [storage.provider.config]
# provider = "sqlite"
# db_url = "sqlite:~/.omninova/storage.db"

# --- Gateway ---
# [gateway]
# host = "0.0.0.0"          # 手机/局域网访问需监听所有网卡（默认 127.0.0.1 仅本机）
# port = 10809
# allow_public_bind = true  # 绑定 0.0.0.0 时建议开启
# session_ttl_secs = 2592000   # 会话历史保留时长，默认 30 天；0 表示永不过期
# max_sessions = 500
# webhook_require_nonce = false
# webhook_max_skew_secs = 300
# webhook_nonce_ttl_secs = 600
# webhook_signature_algorithms = ["sha256", "v1", "v0", "raw"]
# webhook_signature_priority = ["v1", "sha256", "v0", "raw"]
# webhook_signature_strict_priority = false
# webhook_signing_include_timestamp = false
# webhook_signing_require_timestamp = false
#
# --- Gateway DingTalk (企业内部应用机器人) ---
# Default disabled. When enabled=false the /api/v1/gateway/dingtalk/events
# route is registered but every webhook is rejected and no outbound calls
# are made. Real secrets MUST be supplied via environment variables
# (OMNINOVA_DINGTALK_APP_KEY / OMNINOVA_DINGTALK_APP_SECRET) and never
# committed to this file.
# [gateway.dingtalk]
# enabled = false
# app_key = ""                                    # AppKey (prefer env var)
# app_key_env = "OMNINOVA_DINGTALK_APP_KEY"       # override env var name
# app_secret = ""                                 # AppSecret (prefer env var, NEVER commit)
# app_secret_env = "OMNINOVA_DINGTALK_APP_SECRET"
# robot_code = ""                                # robotCode (prefer env var)
# robot_code_env = "OMNINOVA_DINGTALK_ROBOT_CODE"
# card_template_id = ""                          # advanced card template id (optional)
# card_template_id_env = "OMNINOVA_DINGTALK_CARD_TEMPLATE_ID"
# transport_mode = "http"                       # http | stream (interactive cards require stream)
# webhook_path = "/api/v1/gateway/dingtalk/events"  # informational
# outbound_mode = "session_webhook"               # disabled | session_webhook | mock
# redact_sensitive_logs = true                    # log redaction (always-on)

# --- Proxy ---
# [proxy]
# enabled = false
# scope = "all"
# services = ["provider.*", "tool.*"]
# http_proxy = "http://proxy:3128"
# https_proxy = "http://proxy:3128"
# no_proxy = "localhost,127.0.0.1"

# --- Tunnel ---
# [tunnel]
# enabled = false
# provider = "ngrok"
# auth_token = "..."

# --- Browser Tool ---
# [browser]
# enabled = false
# backend = "playwright"
# native_headless = false
# attach_only = false
# cdp_url = "http://127.0.0.1:9222"
# allowed_domains = []

# --- Computer Use (OS desktop) ---
# 操作本机原生窗口（钉钉/飞书客户端/Excel/用友等）。网页请用 [browser]。
# 默认关闭。开启后 screenshot/wait/snapshot 可自动执行；click/type/press 默认要审批。
# allowed_apps 默认 ["*"]，允许前台任意应用。设为 [] 则只能观察；也可写成具体名单。
# macOS 需屏幕录制 + 辅助功能权限。
# [computer_use]
# enabled = false
# allowed_apps = ["*"]              # 默认全部应用；或 [] 禁止键鼠；或 ["钉钉", "飞书"]
# require_screenshot_before_click = true
# max_actions_per_turn = 0          # 单次任务的键鼠次数；0 = 不限，桌面长跑用 0
# max_actions_per_hour = 0          # 每小时键鼠限速；0 = 不限，与 autonomy.max_actions_per_hour 独立
# max_tool_iterations = 200         # 桌面任务一轮里 snapshot+click 很费迭代，别给太小
# max_dimension_px = 1280
# thrash_soft_limit = 3             # 同控件连续失败后提示改用 snapshot/name
# thrash_hard_limit = 5             # 再失败则拒绝该目标，但任务继续，不会整轮中止
# max_snapshot_nodes = 80

# --- Scheduler ---
# 网关启动时会拉起 cron 轮询。长程 task_checkpoint(continue) 依赖它按时唤醒。
# [scheduler]
# enabled = true

# --- HTTP Request Tool ---
# [http_request]
# enabled = false
# allowed_domains = []
# max_response_size = 1048576
# timeout_secs = 30

# --- Web Fetch Tool ---
# 公开网页转正文。新闻/文档优先用这个，不要开浏览器。
# [web_fetch]
# enabled = true
# allowed_domains = []
# max_response_size = 1048576
# timeout_secs = 30

# --- Web Search Tool ---
# 检索用 web_search，读静态页用 web_fetch，不要为搜索去操作 browser。
# [web_search]
# enabled = false
# provider = "brave"
# brave_api_key = "..."
# max_results = 10
# timeout_secs = 15

# --- WeCom Smart Bot ---
# Exactly one inbound transport is active. Existing configurations default to
# `long_connection`; HTTP callback mode does not start the WebSocket transport.
# [gateway.wecom]
# enabled = false
# transport_mode = "long_connection" # long_connection | http_callback
# bot_id_env = "WECOM_BOT_ID"          # long_connection only
# secret_env = "WECOM_BOT_SECRET"      # long_connection only
# callback_token_env = "WECOM_CALLBACK_TOKEN"       # http_callback only
# encoding_aes_key_env = "WECOM_ENCODING_AES_KEY"   # http_callback only
# HTTP callback URL: https://<public-host>/webhook/wecom

# --- Composio ---
# [composio]
# enabled = false
# api_key = "..."
# entity_id = "default"

# --- Skills ---
# [skills]
# open_skills_enabled = false
# open_skills_dir = "~/.omninova/skills"

# --- Reliability ---
# [reliability]
# max_retries = 3
# retry_backoff_ms = 1000
# circuit_breaker_enabled = false

# --- Cost ---
# [cost]
# tracking_enabled = false
# max_daily_cents = 500
# alert_threshold_cents = 400

# --- Channels ---
# Supported: WhatsApp (Baileys), Telegram (grammY), Slack (Bolt), Discord (discord.js),
#   Google Chat, Signal (signal-cli), BlueBubbles (iMessage), iMessage (legacy), IRC,
#   Microsoft Teams, Matrix, Feishu, LINE, Mattermost, Nextcloud Talk, Nostr,
#   Synology Chat, Tlon, Twitch, WeChat, Zalo, Zalo Personal, Lark, 钉钉 (DingTalk), WebChat, Email, Webhook
#
# [channels_config.telegram]
# enabled = false
# token_env = "TELEGRAM_BOT_TOKEN"
#
# [channels_config.discord]
# enabled = false
# token_env = "DISCORD_TOKEN"
#
# [channels_config.slack]
# enabled = false
# token_env = "SLACK_TOKEN"
#
# [channels_config.whatsapp]
# enabled = false
# token_env = "WHATSAPP_CREDENTIALS_PATH"
#
# [channels_config.google_chat]
# enabled = false
# token_env = "GOOGLE_CHAT_CREDENTIALS"
#
# [channels_config.signal]
# enabled = false
# token_env = "SIGNAL_CLI_CONFIG"
#
# [channels_config.bluebubbles]
# enabled = false
# extra = { server_url = "...", webhook_path = "..." }
#
# [channels_config.imessage]
# enabled = false
#
# [channels_config.irc]
# enabled = false
# extra = { server = "...", nick = "..." }
#
# [channels_config.msteams]
# enabled = false
# token_env = "MSTEAMS_BOT_TOKEN"
#
# [channels_config.matrix]
# enabled = false
# token_env = "MATRIX_ACCESS_TOKEN"
#
# [channels_config.wechat]
# enabled = false
# token_env = "WECHAT_BOT_TOKEN"
# extra = { webhook_path = "/webhook/wechat", signing_secret_env = "WECHAT_SIGNING_SECRET" }
#
# [channels_config.feishu]
# enabled = false
# extra = { app_id = "cli_xxxxxxxxxx", app_secret = "...", outbound_mode = "disabled" }
# outbound_mode: "disabled" (default HTTP response only), "mock" (no platform API call), or "real" (send reply through Feishu).
#   # 说明：
#   # - app_id: 飞书应用的 App ID（格式如 cli_xxx）
#   # - app_secret: 飞书应用的 App Secret
#   # - 如需额外字段（如 signing_secret、webhook_path），也可放在 extra 中
#   # 示例：extra = { app_id = "cli_xxx", app_secret = "...", signing_secret = "..." }
#   #
#   # 注意：127.0.0.1 只能本机访问回调。真实飞书公网回调需要：
#   # - 内网穿透（如 ngrok、frp）
#   # - 或部署到公网服务器
#   # 回调地址格式：https://your-domain/webhook/feishu
#
# [channels_config.line]
# enabled = false
# token_env = "LINE_CHANNEL_ACCESS_TOKEN"
#
# [channels_config.mattermost]
# enabled = false
# extra = { url = "...", token_env = "MATTERMOST_TOKEN" }
#
# [channels_config.nextcloud_talk]
# enabled = false
# extra = { base_url = "...", token_env = "NEXTCLOUD_TALK_TOKEN" }
#
# [channels_config.nostr]
# enabled = false
# extra = { relay = "...", private_key_env = "NOSTR_PRIVATE_KEY" }
#
# [channels_config.synology_chat]
# enabled = false
# extra = { incoming_webhook_url = "..." }
#
# [channels_config.tlon]
# enabled = false
#
# [channels_config.twitch]
# enabled = false
# token_env = "TWITCH_BOT_TOKEN"
#
# [channels_config.zalo]
# enabled = false
# token_env = "ZALO_ACCESS_TOKEN"
#
# [channels_config.zalo_personal]
# enabled = false
# token_env = "ZALO_PERSONAL_ACCESS_TOKEN"
#
# [channels_config.lark]
# enabled = false
# extra = { app_id = "cli_xxxxxxxxxx", app_secret = "...", outbound_mode = "disabled" }
# outbound_mode: "disabled" (default HTTP response only), "mock" (no platform API call), or "real" (send reply through Lark).
#   # Lark（国际版飞书）与飞书配置格式相同
#
# [channels_config.dingtalk]
# enabled = false
# token_env = "DINGTALK_BOT_TOKEN"
# extra = { webhook_path = "/webhook/dingtalk", signing_secret_env = "DINGTALK_SIGNING_SECRET" }
#
# [channels_config.email]
# enabled = false
#
# [channels_config.webhook]
# enabled = false
# extra = { signing_secret_env = "WEBHOOK_SIGNING_SECRET" }
#
# [channels_config.webchat]
# enabled = false

