name: Release Build

on:
  push:
    branches:
      - main
      - dev
      - testnew
    tags:
      - "v*"
      - "t*"
    paths:
      - "apps/omninova-tauri/**"
      - "crates/omninova-core/**"
      - "skills/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/omninova-tauri/**"
      - "crates/omninova-core/**"
      - "skills/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  desktop:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            script: build:linux
            check: linux
            target: x86_64-unknown-linux-gnu
            asset_platform: linux-x64
          # Native ARM64 runner: cross-compiling the Rust side from x86_64
          # would need an aarch64 linker and sysroot for the GTK/WebKit stack.
          # The agent-browser staging is no longer a reason — it now follows
          # the build target rather than the host arch.
          - name: Linux (ARM64)
            os: ubuntu-24.04-arm
            script: build:linux:arm64
            check: linux:arm64
            target: aarch64-unknown-linux-gnu
            asset_platform: linux-arm64
            # AppImage is skipped: Tauri's linuxdeploy tooling is unreliable on
            # aarch64, and deb/rpm cover the ARM64 distros in practice.
            bundles: deb,rpm
          - name: macOS (Intel)
            os: macos-latest
            script: build:macos:intel
            check: macos
            target: x86_64-apple-darwin
            asset_platform: macos-intel
          - name: macOS (Apple Silicon)
            os: macos-14
            script: build:macos:apple
            check: macos
            target: aarch64-apple-darwin
            asset_platform: macos-arm64
          - name: Windows
            os: windows-latest
            script: build:windows
            check: windows
            target: x86_64-pc-windows-msvc
            asset_platform: windows-x64

    defaults:
      run:
        working-directory: apps/omninova-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Fix Windows link.exe conflict
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\Git\usr\bin\link.exe",
            "C:\Program Files\Git\mingw64\bin\link.exe"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "Renaming conflict: $path"
              Move-Item -Path $path -Destination "$path.bak" -Force
            }
          }
          
          # Verify link.exe resolution
          try {
            $linkPath = (Get-Command link).Source
            Write-Host "link.exe resolves to: $linkPath"
          } catch {
            Write-Host "link.exe not found in PATH (this is okay if MSVC sets it up later, but usually it should be there)"
          }

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/omninova-tauri/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/omninova-tauri/src-tauri -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Apple code signing & notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          chmod +x ./scripts/setup-apple-signing.sh ./scripts/verify-macos-signature.sh ./scripts/codesign-macos-fallback.sh
          bash ./scripts/setup-apple-signing.sh

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ "$VERSION" == v* ]]; then
              VERSION="${VERSION#v}"
            elif [[ "$VERSION" == t* ]]; then
              VERSION="${VERSION#t}"
            fi
          else
            BRANCH_NAME="${GITHUB_REF_NAME:-branch}"
            SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')
            VERSION="${SANITIZED_BRANCH}-sha-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check build environment
        run: node ./scripts/check-build-env.mjs ${{ matrix.check }}

      - name: Build Tauri app
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          if [ -n "$BUNDLES" ]; then
            npm run ${{ matrix.script }} -- --bundles "$BUNDLES"
          else
            npm run ${{ matrix.script }}
          fi

      - name: Resolve bundle path
        id: resolve_path
        shell: bash
        run: |
          # Check workspace root target (standard for workspace members)
          WS_TARGET_PATH="../../target/${{ matrix.target }}/release/bundle"
          WS_FLAT_PATH="../../target/release/bundle"
          
          # Check package local target (if configured or standalone)
          PKG_TARGET_PATH="./src-tauri/target/${{ matrix.target }}/release/bundle"
          PKG_FLAT_PATH="./src-tauri/target/release/bundle"

          if [ -d "$WS_TARGET_PATH" ]; then
            echo "Found bundle at workspace target path: $WS_TARGET_PATH"
            echo "bundle_path=$WS_TARGET_PATH" >> "$GITHUB_OUTPUT"
          elif [ -d "$WS_FLAT_PATH" ]; then
            echo "Found bundle at workspace flat path: $WS_FLAT_PATH"
            echo "bundle_path=$WS_FLAT_PATH" >> "$GITHUB_OUTPUT"
          elif [ -d "$PKG_TARGET_PATH" ]; then
            echo "Found bundle at package target path: $PKG_TARGET_PATH"
            echo "bundle_path=$PKG_TARGET_PATH" >> "$GITHUB_OUTPUT"
          elif [ -d "$PKG_FLAT_PATH" ]; then
            echo "Found bundle at package flat path: $PKG_FLAT_PATH"
            echo "bundle_path=$PKG_FLAT_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Bundle directory not found."
            echo "Searched locations:"
            echo "- $WS_TARGET_PATH"
            echo "- $WS_FLAT_PATH"
            echo "- $PKG_TARGET_PATH"
            echo "- $PKG_FLAT_PATH"
            echo "Listing workspace target directory:"
            ls -F ../../target/release || echo "workspace target/release not found"
            ls -F ../../target/${{ matrix.target }}/release || echo "workspace target/${{ matrix.target }}/release not found"
            exit 1
          fi

      - name: Ad-hoc codesign macOS bundles (fallback)
        if: runner.os == 'macOS'
        run: |
          bash ./scripts/codesign-macos-fallback.sh "${{ steps.resolve_path.outputs.bundle_path }}"

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        env:
          STRICT_MACOS_SIGNING: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.resolve_path.outputs.bundle_path }}"
          found=0
          while IFS= read -r artifact; do
            [[ -e "$artifact" ]] || continue
            found=1
            bash ./scripts/verify-macos-signature.sh "$artifact"
          done <<EOF
          $(find "$BUNDLE" \( -type d -name '*.app' -o -type f -name '*.dmg' \))
          EOF
          if [ "$found" -eq 0 ]; then
            echo "::warning::No .app/.dmg under $BUNDLE — skip signature verify"
          fi

      - name: Stage desktop release assets
        run: >
          node ./scripts/stage-release-assets.mjs
          ${{ steps.resolve_path.outputs.bundle_path }}
          ./release-assets
          ${{ matrix.asset_platform }}
          ${{ steps.meta.outputs.version }}

      - name: Attach macOS Gatekeeper install guide
        if: runner.os == 'macOS'
        run: cp ../../docs/macOS-安装与修复.txt ./release-assets/

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_platform }}
          path: apps/omninova-tauri/release-assets/**
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    if: >
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/t'))
    needs:
      - desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Collect and deduplicate artifacts
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS.txt
          find . -mindepth 2 -name "SHA256SUMS.txt" -type f -delete
          mapfile -t release_files < <(
            find . -type f \
              \( -name "*.dmg" -o -name "*.deb" -o -name "*.appimage" -o -name "*.rpm" -o -name "*.exe" -o -name "*.msi" -o -name "*.tar.gz" \) \
              -print | sort
          )
          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release artifacts found after download."
            exit 1
          fi
          sha256sum "${release_files[@]}" > SHA256SUMS.txt
          if [ ! -s SHA256SUMS.txt ]; then
            echo "Generated SHA256SUMS.txt is empty."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 't') || contains(github.ref_name, '-') }}
          make_latest: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.appimage
            release-assets/**/*.rpm
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.tar.gz
            release-assets/**/macOS-安装与修复.txt
            release-assets/SHA256SUMS.txt
