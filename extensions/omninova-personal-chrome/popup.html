<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OmniNova Personal Chrome</title>
    <style>
      body { font: 13px/1.45 system-ui, sans-serif; margin: 16px; min-width: 280px; color: #172033; }
      h1 { margin: 0 0 12px; font-size: 17px; }
      .status { padding: 10px 12px; border-radius: 10px; background: #f1f5f9; }
      .status strong { display: block; margin-bottom: 4px; }
      .muted { color: #64748b; font-size: 12px; }
      .actions { display: grid; gap: 8px; margin-top: 12px; }
      button { border: 0; border-radius: 8px; padding: 9px 12px; cursor: pointer; background: #2563eb; color: white; font-weight: 600; }
      button.secondary { background: #eef2f7; color: #334155; }
      button:disabled { cursor: not-allowed; opacity: .45; }
    </style>
  </head>
  <body>
    <h1>OmniNova</h1>
    <div class="status">
      <strong id="status">正在检查…</strong>
      <span id="detail" class="muted">授权默认关闭。</span>
    </div>
    <div class="actions">
      <button id="allow" type="button">允许 OmniNova 访问当前标签页</button>
      <button id="revoke" type="button" class="secondary">撤销访问</button>
    </div>
    <p class="muted">Native Host：<span id="host"></span></p>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
